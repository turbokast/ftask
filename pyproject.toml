[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ftask"
version = "0.1.0"
description = "A human-in-the-loop task inbox for AI coding agents: hand the human exact steps, get notified when they are done."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TurboKast Ltd" }]
keywords = ["ai-agents", "claude-code", "codex", "human-in-the-loop", "task-inbox", "cli", "sqlite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = []   # standard library only

[project.urls]
Homepage = "https://github.com/turbokast/ftask"
Source = "https://github.com/turbokast/ftask"
Issues = "https://github.com/turbokast/ftask/issues"

[project.scripts]
ftask = "ftask.cli:main"

[tool.setuptools]
packages = ["ftask"]

[tool.setuptools.package-data]
ftask = ["ui.html", "AGENTS-SNIPPET.md"]
